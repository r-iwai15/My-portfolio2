name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  hotel-platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotel_folder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: hashicorp/setup-terraform@v3

      - name: Verify Python for tests
        run: |
          python --version
          node --version
          terraform version

      - name: Run Lambda tests
        env:
          PYTHON: python
          GITHUB_ACTIONS: "true"
        run: |
          make test-chatbot
          make test-sentinel-exec
          make test-sentinel-release
          make test-reader
          make test-interface
          make test-reservation
          make -C internal-infra test PYTHON=python GITHUB_ACTIONS=true

      - name: Terraform fmt check
        run: make terraform-fmt-check

      - name: Terraform validate
        run: make terraform-validate
