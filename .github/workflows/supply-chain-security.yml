name: Supply Chain Security

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - lambda/type-b/chatbot
          - lambda/type-a/tools/reader
          - lambda/type-a/interface
          - lambda/type-a/execution/reservation
    defaults:
      run:
        working-directory: hotel_folder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run npm audit (high+)
        working-directory: hotel_folder/${{ matrix.target }}
        run: npm audit --omit=dev --audit-level=high

  pip-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - lambda/type-b/sentinel_executioner/requirements-dev.txt
          - lambda/type-b/sentinel_release/requirements-dev.txt
    defaults:
      run:
        working-directory: hotel_folder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r "${{ matrix.requirements }}"
